# ============================================================
# Gradle / JVM
# ============================================================
# Minecraft 26.x 要求 Java 25，这里指向项目自带的 JDK 25。
# 换机器 / 换路径时改这一行，或者直接用 dev.ps1 / dev.bat 运行。
org.gradle.java.home=E:\\Study\\PythonTest\\my_first_mod\\.jdk\\jdk-25

# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# 配置缓存与 Loom 的镜像定制存在序列化冲突，这里关掉
org.gradle.configuration-cache=false

# ============================================================
# Fabric Properties
# check these on https://fabricmc.net/develop
# ============================================================
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.18-SNAPSHOT

# ============================================================
# Loom 下载镜像 (BMCLAPI)
# Mojang 的下载域名在国内会被 TLS 重置，这里全部换成 BMCLAPI 镜像。
# 内网环境无法使用代理，只能走镜像。
# ============================================================
loom_version_manifests=https://bmclapi2.bangbang93.com/mc/game/version_manifest_v2.json
# 注意：不能用 bmclapi2.bangbang93.com/maven/，它会 302 跳转到中科大镜像，
# 内网访问被拒。这里换成阿里云的 Maven Central 镜像（Minecraft 的库基本都在中央仓库）。
loom_libraries_base=https://maven.aliyun.com/repository/public
loom_resources_base=https://bmclapi2.bangbang93.com/assets/

# ============================================================
# Mod Properties
# ============================================================
version=1.0.0
group=com.example.moreores

# ============================================================
# Dependencies
# ============================================================
fabric_api_version=0.161.0+26.3
